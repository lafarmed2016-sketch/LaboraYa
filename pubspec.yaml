name: laboraya_app
description: "LaboraYa - Encuentra trabajo cerca de ti"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.4

  # Models & Serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.3.4
  firebase_analytics: ^11.4.4

  # Maps & Location (OpenStreetMap - gratuito)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # UI Components
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17
  lottie: ^3.3.1

  # Image & File
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  image_cropper: ^8.0.2

  # Permissions
  permission_handler: ^11.3.1

  # Internationalization
  intl: any

  # WebSocket / Chat
  socket_io_client: ^3.0.2

  # Utilities
  logger: ^2.5.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.3
  device_info_plus: ^11.3.0
  flutter_local_notifications: ^18.0.1
  path_provider: ^2.1.5
  mime: ^2.0.0

  # UI Extras
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^1.2.0+3
  pin_code_fields: ^8.0.1
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2
  timeago: ^3.7.0
  infinite_scroll_pagination: ^4.1.0

  # Google Sign In
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  freezed: ^3.1.0
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.5
  mockito: ^5.4.5
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
